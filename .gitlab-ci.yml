workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

stages:
  - validate
  - test-pure
  - test-native
  - test-e2e
  - coverage
  - package
  - docs
  - pages
  - extended

cache:
  key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/

.pure-tests: &pure-tests
  - cargo test --locked --all-features -p vvm-rs -p vvm-core -p vvm-build -p vvm-macros -p cargo-vvm --lib
  - cargo test --locked --all-features -p vvm-rs --test public_api
  - cargo test --locked --all-features -p vvm-core --test properties
  - cargo test --locked --all-features -p cargo-vvm --test cli -- --skip coverage_command_writes_merged_and_rendered_counter_reports
  - cargo test --locked --all-features -p vvm-macros --test trybuild
  - cargo test --locked --all-features -p vvm-rs --test fixtures pure_consumer_uses_only_the_facade_from_an_isolated_workspace

format-and-lint:
  stage: validate
  image: rust:1-bookworm
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --all -- --check
    - cargo clippy --locked --tests --examples --all-targets --all-features --workspace -- -D warnings

rust-msrv:
  stage: test-pure
  image: rust:1.87.0-bookworm
  script: *pure-tests

rust-stable:
  stage: test-pure
  image: rust:1-bookworm
  script: *pure-tests

native-minimum-verilator:
  stage: test-native
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.000
  script:
    - verilator --version
    - case "$(verilator --version)" in "Verilator 5.000"*) ;; *) exit 1 ;; esac
    - just test-native

native-current-verilator:
  stage: test-native
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  script:
    - verilator --version
    - case "$(verilator --version)" in "Verilator 5.050"*) ;; *) exit 1 ;; esac
    - just test-native

native-fixtures:
  stage: test-native
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  script:
    - just test-native-fixtures

user-facing-examples:
  stage: test-native
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  script:
    - just test-examples

end-to-end:
  stage: test-e2e
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  needs: ["native-current-verilator", "native-fixtures", "user-facing-examples"]
  script:
    - just test-e2e

coverage:
  stage: coverage
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  needs: ["native-current-verilator"]
  script:
    - just test-cov-ci
    - awk '/^TOTAL / { print "LINES_COVERAGE " $10 }' coverage/coverage-summary.txt
  coverage: '/LINES_COVERAGE\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

package-consumer:
  stage: package
  image: rust:1-bookworm
  script:
    - cargo test --locked --all-features -p vvm-rs --test fixtures packaged_consumer_builds_from_extracted_crate_archives

documentation-tests:
  stage: docs
  image: rust:1-bookworm
  script:
    - cargo install mdbook --version 0.5.3 --locked
    - just docs-test
    - just docs-api
    - just docs-links

documentation-site:
  stage: docs
  image: rust:1-bookworm
  script:
    - cargo install mdbook --version 0.5.3 --locked
    - export MDBOOK_BOOK__OUTPUT__HTML__SITE_URL="${CI_PAGES_URL}/"
    - just docs-site
  artifacts:
    when: always
    paths:
      - public/

deploy-pages:
  stage: pages
  image: alpine:3.21
  needs:
    - job: documentation-site
      artifacts: true
  script:
    - test -s public/index.html
    - test -s public/api/vvm/index.html
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

pages-smoke:
  stage: pages
  image: alpine:3.21
  needs:
    - job: documentation-site
      artifacts: true
  script:
    - test -s public/index.html
    - test -s public/getting-started.html
    - test -s public/api/index.html
    - test -s public/api/vvm/index.html
    - test -s public/api/vvm_build/index.html
    - test -s public/api/vvm_core/index.html
    - test -s public/api/vvm_macros/index.html
    - test -s public/cargo-vvm.html

mutation:
  stage: extended
  image: registry.gitlab.com/byacrates/vvm-rs:verilator-5.050
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - just mutation
