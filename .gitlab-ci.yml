image: registry.gitlab.com/byacrates/vvm-rs:latest

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_TAG

stages:
  - test

cache:
  key:
  paths:
    - ~/.cargo/registry/
    - ~/.cargo/git/

test:
  stage: test
  script:
    - echo "Running tests..."
    - just ci
    - awk '/^TOTAL / { print "LINES_COVERAGE " $10 }' coverage/coverage.txt
  coverage: '/LINES_COVERAGE\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

